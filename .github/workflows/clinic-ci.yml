name: Clinic pull request checks

on:
  pull_request:
    paths:
      - '.github/workflows/clinic-ci.yml'
      - 'src/**'
      - 'shared/**'
      - 'scripts/**'
      - 'public/**'
      - 'config/**'
      - 'studio/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'tsconfig.json'
      - 'tailwind.config.*'
      - 'postcss.config.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clinic-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-static-site:
    name: Tests, types and static export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      SANITY_CONTENT_MODE: disabled
    steps:
      - name: Check out proposed source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: TypeScript validation
        run: npm run typecheck -- --incremental false

      - name: Produce local static export
        run: npm run build

      - name: Verify expected static export output
        run: |
          test -s out/index.html
          test -s out/404.html

      - name: Validate exported internal links and anchors
        run: npm run check:links

      # Temporary single-review browser check; remove before merging to keep CI lean.
      - name: One-off 17-route responsive browser audit (four widths)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/verify-clinic-browser.cjs

      - name: Confirm production-release gate has not been enabled
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const cfg = JSON.parse(readFileSync('config/clinic-release.json', 'utf8'));
            if (cfg.releaseStatus !== 'pending' || cfg.booking?.enabled !== false) {
              console.error('Unexpected production release or booking activation; manual review required.');
              process.exit(1);
            }
          "
